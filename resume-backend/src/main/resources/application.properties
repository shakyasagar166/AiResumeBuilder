server.port=${PORT:8080}

# ========================================================
# MySQL Database Configuration (Primary Enterprise Database)
# ========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/resumecraft_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Spring Web
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Redis Configuration (High-Speed Caching & Concurrent Student Quota)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=1000ms

# ========================================================
# 🚀 High-Concurrency Embedded Tomcat Server Optimization (15-50+ Active Users)
# ========================================================
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=30
server.tomcat.accept-count=150
server.tomcat.max-connections=8192
server.tomcat.connection-timeout=20000ms

# Apache Kafka Configuration (High-Volume Asynchronous Student Event Streaming)
resumecraft.kafka.consumer.enabled=true
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=resumecraft-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.retries=3
spring.kafka.producer.acks=1
spring.kafka.producer.batch-size=16384
spring.kafka.producer.buffer-memory=33554432
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.max.block.ms=1000
spring.kafka.listener.concurrency=3
spring.kafka.listener.ack-mode=record
spring.kafka.consumer.properties.session.timeout.ms=30000
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.consumer.properties.max.poll.records=50

# ========================================================
# 🧵 Dedicated Async Thread Pool for High Concurrent Background Processing
# ========================================================
spring.task.execution.pool.core-size=15
spring.task.execution.pool.max-size=60
spring.task.execution.pool.queue-capacity=1000
spring.task.execution.thread-name-prefix=resumecraft-async-worker-

